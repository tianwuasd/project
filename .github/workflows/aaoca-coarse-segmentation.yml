name: AAOCA coarse segmentation

on:
  push:
    paths:
      - 'AAOCA/tools/coarse_segmentation/**'
      - 'AAOCA/start_segmentation.*'
      - 'AAOCA/aaoca_preprocessing/**'
      - 'AAOCA/aaoca_server/**'
      - 'AAOCA/start_aaoca_server.*'
      - 'AAOCA/setup_aaoca_environment.py'
      - 'AAOCA/tests/test_aaoca*.py'
      - 'AAOCA/requirements-preprocess.txt'
      - '.github/workflows/aaoca-coarse-segmentation.yml'
  pull_request:
    paths:
      - 'AAOCA/tools/coarse_segmentation/**'
      - 'AAOCA/start_segmentation.*'
      - 'AAOCA/aaoca_preprocessing/**'
      - 'AAOCA/aaoca_server/**'
      - 'AAOCA/start_aaoca_server.*'
      - 'AAOCA/setup_aaoca_environment.py'
      - 'AAOCA/tests/test_aaoca*.py'
      - 'AAOCA/requirements-preprocess.txt'
      - '.github/workflows/aaoca-coarse-segmentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only synthetic test dependencies
        run: python -m pip install -r AAOCA/tools/coarse_segmentation/requirements.txt -r AAOCA/requirements-preprocess.txt
      - name: Dependency-free server bootstrap
        run: |
          python -S AAOCA/tools/coarse_segmentation/server.py --help
          python -S AAOCA/start_segmentation.py --help
          python -S AAOCA/start_aaoca_server.py --help
          python -S AAOCA/setup_aaoca_environment.py --help
      - name: Segmentation contract, private setup and detached lifecycle
        run: python -m unittest discover -s AAOCA/tools/coarse_segmentation/tests -v
      - name: Preprocessing and actual paired-output integration
        working-directory: AAOCA
        run: python -m unittest discover -s tests -p 'test_aaoca*.py' -v
