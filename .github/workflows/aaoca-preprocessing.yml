name: AAOCA preprocessing

on:
  push:
    paths:
      - 'AAOCA/aaoca_server/**'
      - 'AAOCA/aaoca_preprocessing/**'
      - 'AAOCA/tests/test_aaoca_*.py'
      - 'AAOCA/*aaoca*.py'
      - 'AAOCA/*aaoca*.sh'
      - 'AAOCA/requirements-preprocess.txt'
      - '.github/workflows/aaoca-preprocessing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AAOCA
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: AAOCA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-preprocess.txt
      - name: Synthetic preprocessing and private panel regressions
        run: python -m unittest discover -s tests -p 'test_aaoca_*.py' -v
