[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chd-ct-reproduction"
version = "0.6.0"
description = "ImageCHD primary multi-stage adaptation of Xu et al.; archived paper workflow in back"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.6", "nibabel>=5.2", "PyYAML>=6", "scikit-image>=0.24", "networkx>=3.2", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
chd-ct = "chd_ct.cli:main"
chd-diagnosis = "chd_ct.diagnosis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["back", "runs", "data", "archive", ".venv"]

[tool.ruff]
extend-exclude = ["back"]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
chd_ct = ["presets/*.yaml", "models/reference/*"]
