# Published dimensions/hyperparameters; remaining design choices are in docs/paper-mapping.md.
profile: paper
seed: 42
threads: 4
window: [-200, 1000] # Assumed HU window, not published.
roi_margin: 3 # Assumed native-voxel margin.
augment: true
learning_rate: 0.0002
weight_decay: 0.0
stages:
  crop64: {size: 64, base: 64, levels: 5, epochs: 15, batch: 4}
  crop128: {size: 128, base: 48, levels: 5, epochs: 15, batch: 4}
  all64: {size: 64, base: 64, levels: 5, epochs: 15, batch: 4}
  all128: {size: 128, base: 48, levels: 5, epochs: 15, batch: 4}
  init64: {size: 64, base: 64, levels: 5, epochs: 15, batch: 4}
  init128: {size: 128, base: 48, levels: 5, epochs: 15, batch: 4}
  blood2d: {size: 512, base: 32, levels: 8, epochs: 12, batch: 4}
  blood_lstm: {size: 512, base: 32, layers: 2, sequence: 7, epochs: 3, batch: 1}
