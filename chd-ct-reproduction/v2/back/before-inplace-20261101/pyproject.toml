[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chd-ct-panel-v2"
version = "2.2.0"
description = "CHD V2 integrated panel with isolated STU-Net-S and preserved multistage CT methods"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.6", "nibabel>=5.2", "PyYAML>=6", "scikit-image>=0.24", "networkx>=3.2", "scikit-learn>=1.5", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
chd-ct-v2 = "chd_ct_v2.cli:main"
chd-diagnosis-v2 = "chd_ct_v2.diagnosis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["back", "runs", "data", "archive", ".venv"]

[tool.ruff]
extend-exclude = ["back"]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
chd_ct_v2 = ["presets/*.yaml", "models/reference/*"]
