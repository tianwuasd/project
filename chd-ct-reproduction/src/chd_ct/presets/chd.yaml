# Xu et al. MedIA 2023, Fig. 4 / Table 3; seven ImageCHD structures + background.
profile: chd
seed: 42
threads: 2
data_loading:
  auto_tune: true
  workers: 4
  worker_threads: 1
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  cache: mmap
  cache_max_gib: 32
  cache_reserve_gib: 2
  tune_seconds: 180
  progress_seconds: 30
roi_margin: 3
augment: true
learning_rate: 0.0002
weight_decay: 0.0
stages:
  crop64:
    size: 64
    base: 64
    epochs: 15
    batch: 4
    levels: 5
    spatial_gate: true
    activation_checkpoint: true
  crop128:
    size: 128
    base: 48
    epochs: 15
    batch: 4
    levels: 5
    spatial_gate: true
    activation_checkpoint: true
  all64:
    size: 64
    base: 64
    epochs: 15
    batch: 4
    levels: 5
    spatial_gate: true
    activation_checkpoint: true
  all128:
    size: 128
    base: 48
    epochs: 15
    batch: 4
    levels: 5
    spatial_gate: true
    activation_checkpoint: true
  blood2d:
    size: 512
    base: 32
    epochs: 12
    batch: 4
    levels: 8
    spatial_gate: false
    activation_checkpoint: true
  blood_lstm:
    size: 512
    base: 32
    epochs: 3
    batch: 1
    layers: 2
    sequence: 7
architecture: chd-media2023-fig4-v1
cross_validation:
  folds: 3
  development_scope: auto
