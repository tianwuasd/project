    base: 16
    epochs: 15
    batch: 1
    levels: 4
    spatial_gate: true
  all128:
    size: 128
    base: 16
    epochs: 15
    batch: 1
    levels: 4
    spatial_gate: true
  blood2d:
    size: 256
    base: 8
    epochs: 12
    batch: 1
