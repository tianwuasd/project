name: Verify PaperSpine5 release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (blank uses current manifest)
        required: false
        default: ""
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed release metadata
        run: python paperspine5/release_tools/verify_release.py
      - name: Resolve the requested or current release
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path("website/downloads/manifest.json").read_text())
          tag = os.environ["REQUESTED_TAG"] or manifest["tag"]
          assert re.fullmatch(r"v[0-9A-Za-z][0-9A-Za-z._-]*", tag), "invalid release tag"
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("RELEASE_TAG=" + tag + "\n")
          PY
      - name: Download immutable public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir public-assets
      - name: Verify public package checksums
        working-directory: public-assets
        run: sha256sum --check checksums.sha256
