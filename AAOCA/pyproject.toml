[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaoca-preprocessing"
version = "1.2.0"
description = "Portable CPU preprocessing of HU-calibrated AAOCA NIfTI CT"
readme = "PREPROCESSING.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "nibabel>=5.2,<6", "psutil>=5.9,<8"]

[project.scripts]
aaoca-preprocess = "aaoca_preprocessing.cli:main"
aaoca-server = "aaoca_server.panel:main"

[tool.setuptools]
packages = ["aaoca_preprocessing", "aaoca_server"]
