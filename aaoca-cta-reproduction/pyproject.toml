[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaoca-cta-reproduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "nibabel>=5.2", "SimpleITK>=2.4", "psutil>=7"]

[project.optional-dependencies]
classification = ["torchio==0.19.6", "torch>=2.4", "monai>=1.4", "scikit-learn>=1.3", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
