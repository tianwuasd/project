[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-work-agent"
version = "0.4.0"
description = "A local, evidence-grounded academic research workflow driven by Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "build>=1,<2"]

[project.scripts]
academic-agent = "academic_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academic_agent = ["domain_packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
